[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "provider-core"
version = "0.1.0"
description = "Contained NMR API provider operations and recovery"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["provider_core", "provider_core.*"]
namespaces = false

[tool.setuptools]
include-package-data = false
