# Maintained local definition: original API/provider/lifecycle scope preserved during note 021 cutover.
# Private input/store paths are rebased to the deployment logical paths; terminal retry availability follows current core policy.
schema_id = "nmrnet.provider.runtime_config.v1"

[api]
origin = "https://nmr.localhost:10443"
profile = "dev-local"
topology = "dev-local"
provider_ref = "provider:nmrnet-fw-a"
credential_file = "/srv/nmrnet/input/signing.private.json"
exchange_seconds = 10
retirement_seconds = 5
ca_file = "/srv/nmrnet/input/api-ca.crt"

[interpreter]
max_turns = 6

[[interpreter.endpoints]]
configuration_id = "openai-gpt-5-6-luna"
url = "https://api.openai.com/v1/chat/completions"
model = "gpt-5.6-luna"
key_file = "/srv/nmrnet/input/interpreter.key"
request_bytes = 65536
response_bytes = 262144
exchange_seconds = 25
retirement_seconds = 5
reasoning_effort = "none"

[uploads]
store_origin = "https://nmr.localhost:10443"
per_source_bytes = 1048576
total_bytes = 2097152
requests = 8
seconds = 300
exchange_seconds = 10
retirement_seconds = 5
ca_file = "/srv/nmrnet/input/api-ca.crt"

[preparation]
seed = 17
max_iterations = 200
timeout_seconds = 1
generation_seconds = 5
max_worker_calls = 2
seconds = 240

[lifecycle]
consumer_id = "lane:nmrnet-local"
generation_id = "generation:local-20261023"
store_root = "/srv/nmrnet/attempts"
maximum_records = 2
maximum_checkpoint_bytes = 262144
store_seconds = 10
allowed_job_states = ["open"]
poll_seconds = 2
task_settle_seconds = 10
observation_gap_seconds = 60

[service]
display_name = "NMRNet++"
description = "NMRNet++ predicts per-atom H/C chemical shifts from 3D molecular coordinates. Scientific guide, limits, references and source: https://numpde.github.io/nmrnet-repro/"
offering_description = """
Per-atom ¹H/¹³C chemical shifts (ppm) from 3D geometry. [Inputs, settings and scientific limits](https://numpde.github.io/nmrnet-repro/)

Choose one:

- Paste one geometry with units.
- Attach a structure file; specify units and which structures to use.
- Supply SMILES and a conformer count (1–128).

Supplied structures receive shifts for the H/C atoms present. Missing H is not added and can affect those shifts. SMILES preparation adds H and generates coordinates.

Maximum 128 atoms per geometry, including H. Each geometry is predicted separately; conformers are not averaged. The selected models have no solvent or temperature input."""
page_size = 100
maximum_pages = 10
idle_seconds = 2
api_backoff_max_seconds = 30
hello_seconds = 60
drain_seconds = 120
settle_seconds = 10
allocation_seconds = 30
prediction_seconds = 90
source_seconds = 10

[delivery]
socket_path = "/delivery/provider.sock"
request_seconds = 30
retirement_seconds = 5
retry_initial_seconds = 1
retry_max_seconds = 30
