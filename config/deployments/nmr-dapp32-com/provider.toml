schema_id = "nmrnet.provider.runtime_config.v2"

# Provider policy; the selected shared binding supplies API identity and delivery grants.
# Local interpreter keys and network settings remain outside this public definition.

[interpreter]
max_turns = 6

[[interpreter.endpoints]]
configuration_id = "openai-gpt-5-6-luna"
url = "https://api.openai.com/v1/chat/completions"
model = "gpt-5.6-luna"
key_file = "/srv/nmrnet/input/openai.key"
request_bytes = 65536
response_bytes = 262144
exchange_seconds = 25
retirement_seconds = 5
reasoning_effort = "none"

[uploads]
store_origin = "https://nmr.dapp32.com"
per_source_bytes = 1048576
total_bytes = 2097152
requests = 8
seconds = 300
exchange_seconds = 10
retirement_seconds = 5

[preparation]
seed = 17
max_iterations = 200
timeout_seconds = 1
generation_seconds = 5
max_worker_calls = 2
seconds = 240

[lifecycle]
consumer_id = "lane:nmrnet-pa-a"
generation_id = "generation:nmrnet-pa-a-run"
lifetime_root = "/srv/nmrnet/attempts"
maximum_live_attempts = 2
maximum_control_bytes = 262144
maximum_pending_terminal_bytes = 4194304
start_replays = 1
start_seconds = 90
allowed_job_states = ["open"]
poll_seconds = 2
task_settle_seconds = 10
observation_gap_seconds = 60

[service]
display_name = "NMRNet++"
description = "NMRNet++ predicts per-atom ¹H and ¹³C chemical shifts (ppm) from 3D molecular coordinates using released models. Supply coordinates or generate conformers from SMILES. [Scientific guide](https://numpde.github.io/nmrnet-repro/)"
offering_description = """
**¹H and ¹³C chemical-shift prediction**

Predicts per-atom shifts (ppm) using released NMRNet++ models.

**Provide one:**

- Paste element symbols and 3D coordinates for one geometry.
- Attach a 3D structure file and specify which records to use.
- Supply SMILES with the intended protonation state and request 1–128 conformers.

For supplied coordinates, state units: angstrom, nm or bohr. Supplied geometries are not optimized; missing hydrogens are not added and can affect other shifts. SMILES preparation adds hydrogens and generates 3D coordinates.

**Results:** shifts linked to atoms in each geometry; conformers are not averaged. Limits: 128 geometries per request; 128 atoms per geometry, including hydrogens. Solvent and temperature are not model inputs.

**Detail:** `verbosity: low` returns shifts and atom correspondence; `medium` (default) adds coordinates; `max` adds the software source manifest.

[Scientific guide](https://numpde.github.io/nmrnet-repro/)"""
page_size = 100
maximum_pages = 10
idle_seconds = 2
api_backoff_max_seconds = 30
hello_seconds = 60
drain_seconds = 120
settle_seconds = 10
allocation_seconds = 30
prediction_seconds = 90
source_seconds = 10

[delivery]
request_seconds = 30
retirement_seconds = 5
retry_initial_seconds = 1
retry_max_seconds = 30
