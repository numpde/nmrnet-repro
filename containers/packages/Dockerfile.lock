ARG UV_IMAGE
ARG PYTHON_BASE
FROM ${UV_IMAGE} AS uv
FROM ${PYTHON_BASE}
COPY --from=uv /uv /usr/local/bin/uv
# Keep the lock owner and shared guard together for ordinary module imports.
ENV NMRNET_IN_CONTAINER=1
WORKDIR /opt/lock
COPY tools/package_lock.py tools/container_guard.py ./tools/
ENTRYPOINT ["python3", "-B", "-m", "tools.package_lock"]
