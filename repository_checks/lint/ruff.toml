# Source policy: secs-repro 34f5915c1534278bbf61b4c6592afa44cf94ab08,
# secs gitlink 0414b5f9d65e61a6ba00aa046e24b8e48ce230b1,
# secs/pyproject.toml [tool.ruff]; CI requires Ruff 0.15.15.
# https://github.com/numpde/secs-repro/blob/34f5915c1534278bbf61b4c6592afa44cf94ab08/secs/pyproject.toml
# Commands select every authored Python tree, including tests and the checks.
line-length = 130
lint.select = [
  "E", "F", "W", "B", "I", "ARG", "C4", "EM", "ICN", "ISC", "G",
  "PGH", "PIE", "PL", "PT", "PTH", "RET", "RUF", "SIM", "T20", "UP",
  "YTT", "EXE", "NPY", "PD",
]
lint.extend-ignore = ["PLR", "E501", "B028", "EM101", "EM102", "G004", "RUF015", "RET505"]
# The shared guard must run before operational imports. The separate authored
# import-order gate retains E402's late-import rejection after that one required
# guard call. Unittest owns assertion and exception contexts in both test trees;
# pytest's PT009/PT027 spelling preferences do not apply to that runner.
lint.per-file-ignores = { "scripts/*" = ["T201"], "tools/*" = ["E402"], "repository_checks/*" = ["E402", "PT009", "PT027"], "tests/*" = ["E402", "PT009", "PT027"], "nmrnet_inference/*" = ["E402"], "nmrnet_provider/*" = ["E402"], "packages/*/src/*" = ["E402"], "packages/*/tests/*" = ["E402", "PT009", "PT027"] }
lint.unfixable = ["T20", "F841"]
lint.flake8-unused-arguments.ignore-variadic-names = true
lint.pydocstyle.convention = "numpy"
lint.isort.known-first-party = ["tools", "repository_checks", "nmrnet_inference", "nmrnet_provider", "provider_core"]
src = ["tools", "repository_checks", "nmrnet_inference", "nmrnet_provider", "packages/provider-core/src"]
# Retain the original exclusions; every authored tree remains in the gate.
extend-exclude = ["resources_ee", "notebooks", "app", "data/**", "configs"]
